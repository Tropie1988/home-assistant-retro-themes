# Retro OS Collection / Volume II - 07 - Amiga Workbench 2.x
# Ispirazione storica: 1990.
# Workbench 2.x: grigio medio, barre blu, selezioni arancioni e font tecnico monospaziato.
# Tema Home Assistant nativo, senza HACS e senza card aggiuntive.
# Copiare in /config/themes/ e lanciare frontend.reload_themes.
# Per la raccolta: frontend: + themes: !include_dir_merge_named themes
# Nota: Workbench 2.x e non Workbench 1.x: il grigio e il blu predominano, mentre arancione e secondario.
# Le variabili grafiche dipendono dal frontend Home Assistant in uso.

Amiga Workbench 2.x:

  # Colori principali
  primary-color: "#235A9E"
  accent-color: "#CF741D"
  dark-primary-color: "#123259"
  light-primary-color: "#89AFD7"
  primary-background-color: "#B0B0B0"
  secondary-background-color: "#D2D2D2"
  card-background-color: "#C9C9C9"
  clear-background-color: "#FFFFFF"
  primary-text-color: "#171717"
  secondary-text-color: "#454545"
  text-primary-color: "#FFFFFF"
  disabled-text-color: "#7A7A7A"
  divider-color: "#777777"

  # Desktop, pannelli e aree dati
