# Retro OS Collection / Volume II - 06 - OS/2 Warp 4
# Ispirazione storica: 1996.
# IBM Workplace Shell: blu-viola elettrico, pannelli grigi, accenti ciano e pulsanti squadrati.
# Tema Home Assistant nativo, senza HACS e senza card aggiuntive.
# Copiare in /config/themes/ e lanciare frontend.reload_themes.
# Per la raccolta: frontend: + themes: !include_dir_merge_named themes
# Nota: Ispirato a OS/2 Warp 4 Merlin (1996), con palette Workplace Shell. Le cartelle Workplace Shell richiedono una dashboard.
# Le variabili grafiche dipendono dal frontend Home Assistant in uso.

OS2 Warp 4 Merlin:

