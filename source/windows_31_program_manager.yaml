# Retro OS Collection / Volume II - 03 - Windows 3.1
# Ispirazione storica: 1992.
# Program Manager: sfondo grigio retinato, finestre squadrate e blu acceso delle barre titolo.
# Tema Home Assistant nativo, senza HACS e senza card aggiuntive.
# Copiare in /config/themes/ e lanciare frontend.reload_themes.
# Per la raccolta: frontend: + themes: !include_dir_merge_named themes
# Nota: Rende colori e pannelli; Program Manager e gruppi di icone richiedono una dashboard dedicata.
# Le variabili grafiche dipendono dal frontend Home Assistant in uso.

Windows 3.1 Program Manager:

  # Colori principali
  primary-color: "#000080"
  accent-color: "#800080"
  dark-primary-color: "#000040"
  light-primary-color: "#8484C8"
  primary-background-color: "#C0C0C0"
  secondary-background-color: "#E0E0E0"
  card-background-color: "#FFFFFF"
  clear-background-color: "#FFFFFF"
  primary-text-color: "#0A0A0A"
  secondary-text-color: "#4B4B4B"
  text-primary-color: "#FFFFFF"
  disabled-text-color: "#828282"
  divider-color: "#888888"

  # Desktop, pannelli e aree dati
  lovelace-background: "repeating-linear-gradient(0deg, #C0C0C0 0px, #C0C0C0 2px, #CBCBCB 2px, #CBCBCB 3px) fixed"
  ha-panel-background: "#C0C0C0"
  ha-panel-toolbar-background: "#E0E0E0"
  ha-data-table-background: "#FFFFFF"

  # Barra superiore e navigazione
  app-header-background-color: "#000080"
  app-header-text-color: "#FFFFFF"
  app-header-border-bottom: "2px solid #000000"
  app-theme-color: "#000080"
  sidebar-background-color: "#C0C0C0"
  sidebar-text-color: "#0A0A0A"
  sidebar-icon-color: "#333333"
  sidebar-selected-icon-color: "#000080"
  sidebar-selected-text-color: "#000080"

  # Finestre e schede dal bordo vintage
  ha-card-background: "#FFFFFF"
  ha-card-border-radius: "0px"
  ha-card-border-width: "1px"
  ha-card-border-color: "#000000"
  ha-card-box-shadow: "inset 1px 1px 0 #FFFFFF, inset -2px -2px 0 #808080, 3px 3px 0 #666666"
  ha-card-header-color: "#000080"
  ha-card-header-font-size: "17px"
  ha-card-header-font-family: "\"MS Sans Serif\", \"Microsoft Sans Serif\", Arial, sans-serif"
  ha-section-border-radius: "0px"
  ha-section-background-color: "transparent"
  ha-view-sections-extra-top-margin: "16px"
  ha-view-sections-column-gap: "13px"
  ha-view-sections-row-gap: "13px"
  grid-card-gap: "10px"
