# Retro OS Collection / Volume II - 05 - Solaris CDE
# Ispirazione storica: 1990s.
# Sun workstation con Motif/CDE: desktop verde petrolio grigiastro, pannelli 3D e accenti viola.
# Tema Home Assistant nativo, senza HACS e senza card aggiuntive.
# Copiare in /config/themes/ e lanciare frontend.reload_themes.
# Per la raccolta: frontend: + themes: !include_dir_merge_named themes
# Nota: Motif e il pannello CDE reale non vengono creati: i bordi in rilievo ne evocano la grafica.
# Le variabili grafiche dipendono dal frontend Home Assistant in uso.

Solaris CDE Motif:

