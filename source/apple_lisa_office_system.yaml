# Retro OS Collection / Volume III - 1983 - Apple Lisa Office System
# Lisa Office System: desktop retinato, rigore monocromatico e bordi neri.
# Tema Home Assistant nativo: nessun HACS, nessuna card aggiuntiva.
# Da copiare in /config/themes/; poi frontend.reload_themes.
# Richiede in configuration.yaml: frontend: themes: !include_dir_merge_named themes
# Nota: riproduzione cromatica e stilistica, non emulazione dell interfaccia originale.
# Alcuni dettagli dipendono dalla versione frontend e dal browser.

Apple Lisa Office System:

  # Colori principali
  primary-color: "#272727"
  accent-color: "#4F4F4F"
  dark-primary-color: "#101010"
  light-primary-color: "#AFAFAF"
  primary-background-color: "#DFDFDF"
