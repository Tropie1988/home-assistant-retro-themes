# Retro OS Collection / Volume II - 02 - Windows NT 4.0
# Ispirazione storica: 1996.
# Interpretazione workstation: blu ardesia, argento freddo, controlli squadrati e contrasto aziendale.
# Tema Home Assistant nativo, senza HACS e senza card aggiuntive.
# Copiare in /config/themes/ e lanciare frontend.reload_themes.
# Per la raccolta: frontend: + themes: !include_dir_merge_named themes
# Nota: Palette alternativa ispirata a una workstation NT, non al colore desktop predefinito (che poteva essere petrolio).
# Le variabili grafiche dipendono dal frontend Home Assistant in uso.

Windows NT 4.0 Workstation:

  # Colori principali
  primary-color: "#173A73"
  accent-color: "#316A78"
  dark-primary-color: "#0C2345"
  light-primary-color: "#779CB9"
  primary-background-color: "#BDC5CA"
  secondary-background-color: "#DAE0E3"
  card-background-color: "#CED3D4"
