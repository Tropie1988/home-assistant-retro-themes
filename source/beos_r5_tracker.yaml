# Retro OS Collection / Volume III - 2000 - BeOS R5 Tracker
# BeOS Release 5: desktop blu, finestre grigie e linguette gialle.
# Tema Home Assistant nativo: nessun HACS, nessuna card aggiuntiva.
# Da copiare in /config/themes/; poi frontend.reload_themes.
# Richiede in configuration.yaml: frontend: themes: !include_dir_merge_named themes
# Nota: riproduzione cromatica e stilistica, non emulazione dell interfaccia originale.
# Alcuni dettagli dipendono dalla versione frontend e dal browser.

BeOS R5 Tracker:

  # Colori principali
  primary-color: "#A57500"
  accent-color: "#EBC83E"
  dark-primary-color: "#654900"
  light-primary-color: "#F8D96A"
  primary-background-color: "#D6D6D6"
  secondary-background-color: "#E5E5E5"
  card-background-color: "#F3F3F3"
  clear-background-color: "#FFFFFF"
  primary-text-color: "#171717"
  secondary-text-color: "#444444"
  text-primary-color: "#FFFFFF"
  disabled-text-color: "#848484"
  divider-color: "#8B8B8B"

  # Desktop, pannelli e aree dati
  lovelace-background: "#356493"
  ha-panel-background: "#D6D6D6"
  ha-panel-toolbar-background: "#E0E0E0"
  ha-data-table-background: "#FFFFFF"

  # Barra superiore e navigazione
  app-header-background-color: "#EBC83E"
  app-header-text-color: "#191919"
  app-header-border-bottom: "2px solid #6F5D26"
  app-theme-color: "#EBC83E"
  sidebar-background-color: "#D6D6D6"
  sidebar-text-color: "#232323"
  sidebar-icon-color: "#454545"
  sidebar-selected-icon-color: "#8C6200"
  sidebar-selected-text-color: "#6D4F08"

  # Finestre e schede dal bordo vintage
  ha-card-background: "#F3F3F3"
  ha-card-border-radius: "0px"
  ha-card-border-width: "1px"
  ha-card-border-color: "#767676"
  ha-card-box-shadow: "inset 1px 1px 0 #FFFFFF, inset -1px -1px 0 #A0A0A0, 2px 3px 0 rgba(0,0,0,0.38)"
  ha-card-header-color: "#6D4F08"
  ha-card-header-font-size: "16px"
  ha-card-header-font-family: "\"Swis721 BT\", \"Helvetica Neue\", Arial, sans-serif"
  ha-section-border-radius: "0px"
  ha-section-background-color: "transparent"
  ha-view-sections-extra-top-margin: "16px"
  ha-view-sections-column-gap: "12px"
  ha-view-sections-row-gap: "12px"
  grid-card-gap: "10px"
  stack-card-gap: "10px"

  # Font e geometria
  ha-font-family-body: "\"Swis721 BT\", \"Helvetica Neue\", Arial, sans-serif"
  ha-font-family-heading: "\"Swis721 BT\", \"Helvetica Neue\", Arial, sans-serif"
  ha-font-family-code: "\"Courier New\", \"Lucida Console\", monospace"
  ha-font-weight-heading: "700"
  ha-font-weight-body: "400"
  ha-border-radius-xs: "0px"
  ha-border-radius-sm: "0px"
  ha-border-radius-md: "0px"
  ha-border-radius-lg: "0px"
  ha-border-radius-xl: "0px"
  ha-border-radius-2xl: "0px"
  ha-picture-border-radius: "0px"
  ha-picture-border-radius-sm: "0px"

  # Palette dei componenti moderni
  ha-color-primary-05: "#181407"
