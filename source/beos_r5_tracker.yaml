  ha-color-primary-70: "#EAD395"
  ha-color-primary-80: "#F5E8C1"
  ha-color-primary-90: "#FCF4D8"
  ha-color-primary-95: "#FFF9E8"

  # Design token per superfici, campi e bottoni
