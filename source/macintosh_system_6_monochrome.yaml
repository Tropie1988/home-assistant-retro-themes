# Retro OS Collection / Volume II - 04 - Macintosh System 6
# Ispirazione storica: 1988.
# Finder pre-Platinum: bianco e nero, linee nette, retinatura e selezioni in grafite.
# Tema Home Assistant nativo, senza HACS e senza card aggiuntive.
# Copiare in /config/themes/ e lanciare frontend.reload_themes.
# Per la raccolta: frontend: + themes: !include_dir_merge_named themes
# Nota: Monocromatico nell interfaccia, ma stati/allarmi ed energia restano volutamente colorati per sicurezza e leggibilita.
# Le variabili grafiche dipendono dal frontend Home Assistant in uso.

Macintosh System 6 Monochrome:

  # Colori principali
  primary-color: "#252525"
  accent-color: "#525252"
  dark-primary-color: "#080808"
  light-primary-color: "#A3A3A3"
  primary-background-color: "#ECECEC"
  secondary-background-color: "#F6F6F6"
  card-background-color: "#FFFFFF"
  clear-background-color: "#FFFFFF"
  primary-text-color: "#101010"
  secondary-text-color: "#4A4A4A"
  text-primary-color: "#101010"
  disabled-text-color: "#888888"
  divider-color: "#777777"

  # Desktop, pannelli e aree dati
  lovelace-background: "repeating-linear-gradient(0deg, #D0D0D0 0px, #D0D0D0 1px, #EBEBEB 1px, #EBEBEB 3px) fixed"
  ha-panel-background: "#E8E8E8"
  ha-panel-toolbar-background: "#FFFFFF"
  ha-data-table-background: "#FFFFFF"

  # Barra superiore e navigazione
  app-header-background-color: "#FFFFFF"
  app-header-text-color: "#101010"
  app-header-border-bottom: "2px solid #101010"
  app-theme-color: "#FFFFFF"
  sidebar-background-color: "#F0F0F0"
  sidebar-text-color: "#101010"
  sidebar-icon-color: "#333333"
  sidebar-selected-icon-color: "#252525"
  sidebar-selected-text-color: "#252525"

  # Finestre e schede dal bordo vintage
  ha-card-background: "#FFFFFF"
  ha-card-border-radius: "0px"
  ha-card-border-width: "1px"
  ha-card-border-color: "#141414"
  ha-card-box-shadow: "2px 2px 0 #1B1B1B"
  ha-card-header-color: "#111111"
  ha-card-header-font-size: "18px"
  ha-card-header-font-family: "Chicago, Geneva, \"Lucida Grande\", Arial, sans-serif"
  ha-section-border-radius: "0px"
  ha-section-background-color: "transparent"
  ha-view-sections-extra-top-margin: "16px"
  ha-view-sections-column-gap: "15px"
  ha-view-sections-row-gap: "15px"
  grid-card-gap: "10px"
  stack-card-gap: "10px"

  # Font e geometria
  ha-font-family-body: "Chicago, Geneva, \"Lucida Grande\", Arial, sans-serif"
  ha-font-family-heading: "Chicago, Geneva, \"Lucida Grande\", Arial, sans-serif"
  ha-font-family-code: "\"Lucida Console\", Monaco, monospace"
  ha-font-weight-heading: "700"
  ha-font-weight-body: "400"
  ha-border-radius-xs: "0px"
  ha-border-radius-sm: "0px"
  ha-border-radius-md: "0px"
  ha-border-radius-lg: "0px"
  ha-border-radius-xl: "0px"
  ha-border-radius-2xl: "0px"
  ha-picture-border-radius: "0px"
  ha-picture-border-radius-sm: "0px"

  # Palette dei componenti moderni
  ha-color-primary-05: "#0B0D13"
